name: Publish to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Import GPG key
        run: |
          echo "$SIGNING_KEY" | base64 --decode > signingkey.asc
          gpg --batch --import signingkey.asc
        env:
          SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}

      - name: Publish
        run: ./gradlew publishAllPublicationsToCentralPortalRepository
        env:
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.key: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}