name: Publish to Maven Central

on:
  release:
    types: [published]
  # Manual validation run: uploads to the Central Portal WITHOUT releasing.
  # Inspect the deployment at central.sonatype.com and publish or drop it there.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Publish and release
        if: github.event_name == 'release'
        run: ./gradlew publishAndReleaseToMavenCentral

      - name: Upload without releasing (validation)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew publishToMavenCentral
